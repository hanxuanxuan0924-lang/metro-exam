<style>

<body>

   let inputHTML='';
   if(['single','multi','judge'].includes(sec.type)){
    inputHTML='<div class="opts">'+q.options.map((o,oi)=>{const checked=sec.type==='multi'?(Array.isArray(saved)&&saved.includes(oi)):saved===oi;return `<label class="opt"><input type="${sec.type==='multi'?'checkbox':'radio'}" name="ans-${key}" value="${oi}" ${checked?'checked':''} onchange="recordAnswer('${key}', '${sec.type}', this)"> <span><b>${letters(oi)}.</b> ${esc(o)}</span></label>`}).join('')+'</div>';
   }else{
    inputHTML=`<textarea placeholder="请在此输入答案…" oninput="recordText('${key}',this)">${esc(saved||'')}</textarea>`;
   }
   const answerDisplay=Array.isArray(q.answer)?q.answer.map(x=>letters(Number(x))).join('、'):q.answer;
   const optsEdit=(q.options||[]).map((o,oi)=>`<label>选项 ${letters(oi)}<input type="text" value="${esc(o)}" onchange="editOption(${si},${qi},${oi},this.value)"></label>`).join('');
   const keyInput=sec.type==='multi'?`<label>标准答案（填写选项字母，可写 AC 或 A,C）<input type="text" value="${esc((q.answer||[]).map(x=>typeof x==='number'?letters(x):x).join(','))}" onchange="editKey(${si},${qi},this.value)"></label>`:
    ['single','judge'].includes(sec.type)?`<label>标准答案（填写选项字母，如 A）<input type="text" value="${esc(typeof q.answer==='number'?letters(q.answer):q.answer||'')}" onchange="editKey(${si},${qi},this.value)"></label>`:`<label>参考答案 / 阅卷要点<textarea onchange="editKey(${si},${qi},this.value)">${esc(q.answer||'')}</textarea></label>`;
   card.innerHTML=`<div class="qhead"><span class="qnum">${num}.</span>${esc(q.text)}</div>${inputHTML}<div class="answer"><b>参考答案：</b>${esc(answerDisplay||'尚未设置标准答案')}</div>
   <div class="editpanel"><label>题目文本<textarea onchange="editQuestion(${si},${qi},this.value)">${esc(q.text)}</textarea></label>${optsEdit}${keyInput}<button onclick="deleteQuestion(${si},${qi})">删除本题</button></div>`;
   section.appendChild(card);
  });
  const add=document.createElement('button');add.textContent='+ 添加一道题';add.onclick=()=>addQuestion(si);add.style.display=editing?'inline-block':'none';section.appendChild(add);
  wrap.appendChild(section);
 });
 document.getElementById('totalPoints').textContent=total;
 updateProgress();saveData();
}
window.recordAnswer=(key,type,el)=>{if(type==='multi'){const vals=[...document.querySelectorAll(`input[name="ans-${key}"]:checked`)].map(x=>Number(x.value));answers[key]=vals}else answers[key]=Number(el.value);updateProgress()};
window.recordText=(key,el)=>{answers[key]=el.value;updateProgress()};
function updateProgress(){let total=0,done=0;data.sections.forEach((s,si)=>s.questions.forEach((q,qi)=>{total++;const a=answers[`${si}-${qi}`];if(Array.isArray(a)?a.length>0:(a!==undefined&&String(a).trim()!==''))done++}));document.getElementById('progressBar').style.width=(total?done/total*100:0)+'%'}
window.editQuestion=(si,qi,v)=>{data.sections[si].questions[qi].text=v;saveData();render()};
window.editOption=(si,qi,oi,v)=>{data.sections[si].questions[qi].options[oi]=v;saveData();render()};
window.editKey=(si,qi,v)=>{const s=data.sections[si],q=s.questions[qi];if(s.type==='multi')q.answer=[...new Set(v.toUpperCase().replace(/[^A-G]/g,'').split('').map(c=>c.charCodeAt(0)-65))].filter(n=>n>=0&&n<q.options.length).sort((a,b)=>a-b);else if(['single','judge'].includes(s.type)){const t=v.trim().toUpperCase();q.answer=/^[A-G]$/.test(t)?t.charCodeAt(0)-65:''}else q.answer=v;saveData();render()};
window.deleteQuestion=(si,qi)=>{if(confirm('确定删除这道题？')){data.sections[si].questions.splice(qi,1);saveData();render()}};
window.addQuestion=(si)=>{const s=data.sections[si],q=s.type==='single'?{text:'新单选题',options:['选项A','选项B','选项C','选项D'],answer:''}:s.type==='multi'?{text:'新多选题',options:['选项A','选项B','选项C','选项D'],answer:[]}:s.type==='judge'?{text:'新判断题',options:['正确','错误'],answer:''}:{text:'新题目',answer:''};s.questions.push(q);saveData();render()};
document.getElementById('editBtn').onclick=()=>{editing=!editing;document.getElementById('editBtn').textContent=editing?'完成编辑':'编辑试题 / 答案';render()};
document.getElementById('showBtn').onclick=()=>{document.body.classList.toggle('show-answers');document.getElementById('showBtn').textContent=document.body.classList.contains('show-answers')?'隐藏答案':'显示答案'};
document.getElementById('gradeBtn').onclick=()=>{
 let score=0,max=0,graded=0,unkeyed=0,details=[];
 data.sections.forEach((s,si)=>{if(!['single','multi','judge'].includes(s.type))return;s.questions.forEach((q,qi)=>{max+=Number(s.points)||0;const key=`${si}-${qi}`,a=answers[key];let correct=false,hasKey=s.type==='multi'?Array.isArray(q.answer)&&q.answer.length>0:(q.answer!==''&&q.answer!==null&&q.answer!==undefined);
 if(!hasKey){unkeyed++;details.push(`第 ${qi+1} 题：未设置标准答案，未计分。`);return}
 if(a===undefined){graded++;details.push(`第 ${qi+1} 题：未作答（0分）。`);return}
 if(s.type==='multi')correct=Array.isArray(a)&&a.length===q.answer.length&&a.every(x=>q.answer.includes(x));
 else correct=a===q.answer;
 graded++;if(correct)score+=Number(s.points)||0;details.push(`第 ${qi+1} 题：${correct?'正确':'错误'}（${correct?s.points:0}/${s.points}分）`);
 })});
 document.getElementById('result').hidden=false;document.getElementById('scoreText').textContent=`${score} / ${max} 分`;
 document.getElementById('scoreDetails').innerHTML=`已判分 ${graded} 题；未设置答案键 ${unkeyed} 题。<br>${details.map(esc).join('<br>')}<p class="small">简答题、计算题未自动评分，请人工阅卷。未设置标准答案的题目不计入已判分题数，但仍显示在客观题满分中。</p>`;
 document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'});
};
document.getElementById('exportBtn').onclick=()=>{
 const lines=[data.title,`姓名：${document.getElementById('studentName').value||'未填写'}`,`日期：${document.getElementById('examDate').value||'未填写'}`,''];
 data.sections.forEach((s,si)=>{lines.push(s.title);s.questions.forEach((q,qi)=>{const key=`${si}-${qi}`,a=answers[key];let val='未作答';if(Array.isArray(a))val=a.map(letters).join('、')||'未作答';else if(typeof a==='number')val=letters(a);else if(typeof a==='string'&&a.trim())val=a;lines.push(`${qi+1}. ${q.text}`,`答：${val}`);});lines.push('')});
 const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(document.getElementById('studentName').value||'答卷')+'_答卷.txt';a.click();URL.revokeObjectURL(url);
};
document.getElementById('studentName').addEventListener('input',()=>localStorage.setItem('exam_student_name',document.getElementById('studentName').value));
document.getElementById('examDate').addEventListener('input',()=>localStorage.setItem('exam_date',document.getElementById('examDate').value));
document.getElementById('studentName').value=localStorage.getItem('exam_student_name')||'';
document.getElementById('examDate').value=localStorage.getItem('exam_date')||'';
render();
</script></body></html>
